<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="main">
        <header id="header">
            <h2 class="player active-player" id="xPlayer">X</h2>
            <h2 id="headerTitle">Choose</h2>
            <h2 class="player" id="oPlayer">O</h2>
        </header>

        <section id="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </section>

        <div class="buttons">
            <button class="btn" id="computerBtn">Play With Computer</button>
            <button class="btn" id="restartBtn">Restart</button>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
